name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.5.3 --activate
      - name: Resolve pnpm store
        id: pnpm
        run: echo "dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm.outputs.dir }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      # Every line must be an unabbreviated SHA reachable from the default branch, since git treats
      # an unreachable one as a silent no-op and blame then skips nothing.
      - name: Validate .git-blame-ignore-revs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          file=.git-blame-ignore-revs
          if [ ! -f "$file" ]; then
            echo "::error::$file is missing; drop this step too if the file is intentionally gone"
            exit 1
          fi
          err=$(mktemp)
          # The `|| [ -n ]` keeps a final line that has no trailing newline.
          while read -r sha _ || [ -n "$sha" ]; do
            case "$sha" in '' | '#'*) continue ;; esac
            if [[ ! "$sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error file=$file::'$sha' is not an unabbreviated 40-character SHA; git blame rejects anything shorter"
              exit 1
            fi
            # Compared through the API because actions/checkout is shallow. Keep stderr out of
            # $status: on failure gh writes the error body to stdout, and its newlines would
            # truncate the ::error annotation to its first line.
            if ! status=$(gh api "repos/$REPO/compare/$BASE...$sha" --jq '.status' 2>"$err"); then
              echo "::error file=$file::could not compare $sha against $BASE, so its reachability is unknown: $(tr -d '\r\n' <"$err")"
              exit 1
            fi
            case "$status" in
              identical | behind) ;;
              *)
                echo "::error file=$file::$sha is '$status' relative to $BASE; only commits already merged to $BASE can be listed here"
                exit 1
                ;;
            esac
          done < "$file"

  check:
    name: Typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.5.3 --activate
      - name: Resolve pnpm store
        id: pnpm
        run: echo "dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm.outputs.dir }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm check
      - name: Unit tests
        run: pnpm test

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.5.3 --activate
      - name: Resolve pnpm store
        id: pnpm
        run: echo "dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm.outputs.dir }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run e2e
        run: pnpm exec playwright test --reporter=github,html
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
